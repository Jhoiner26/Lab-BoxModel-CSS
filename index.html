<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cédula Digital</title>
    <!-- Fuentes Google -->
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Young+Serif&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Estilos -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Contenedor principal -->
    <main class="contenedor-principal">
        <div class="credencial">

            <!-- Insignia -->
            <span class="insignia-badge">BOOTCAMP 2026</span>

            <!-- Encabezado -->
            <header class="credencial-header">
                <span class="pais">REPÚBLICA DE COLOMBIA</span>
                <h2>CÉDULA DE CIUDADANÍA</h2>
            </header>

            <!-- Cuerpo -->
            <section class="credencial-body">
                <div class="contenedor-foto">
                    <img src="foto.jpg" alt="Foto de Jhoiner Andretty Silva Montaño" class="avatar">
                    <!-- Estado -->
                    <span class="etiqueta-online">ONLINE</span>
                </div>

                <div class="info-personal">
                    <span class="numero-cedula">C.C. 0.000.000.000</span>
                    <h1 class="nombre">Jhoiner Andretty Silva Montaño</h1>

                    <p class="rol"><i class="fa-solid fa-code"></i> Full-Stack Java Dev</p>

                    <!-- Datos -->
                    <ul class="lista-detalles">
                        <li><i class="fa-solid fa-location-dot"></i> <span>Barrancabermeja, Santander, Colombia</span></li>
                        <li><i class="fa-solid fa-envelope"></i> <a href="mailto:jhoinerandretty@gmail.com">jhoinerandretty@gmail.com</a></li>
                        <li><i class="fa-solid fa-laptop-code"></i> <span>Java / JavaScript</span></li>
                        <li><i class="fa-solid fa-gamepad"></i> <span>Sistemas Embebidos</span></li>
                        <li><i class="fa-brands fa-github"></i> <a href="https://github.com/jhoiner26">github.com/jhoiner26</a></li>
                    </ul>
                </div>
            </section>

            <!-- Pie de página -->
            <footer class="credencial-footer">
                <div class="codigo-barras">
                    <i class="fa-solid fa-barcode"></i>
                    <span>PERFIL PROFESIONAL</span>
                </div>
            </footer>

        </div>
    </main>
</body>
</html>
